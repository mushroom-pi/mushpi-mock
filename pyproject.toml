[project]
name = "mushpi-mock"
version = "0.2.0"
description = "Mock Pico growing unit — mirrors mushpi-grow REST API with synthetic sensor data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "amda-phd", email = "adriana@amda.dev" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.1",
]

[project.scripts]
mushpi-mock = "mushpi_mock.main:cli"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
